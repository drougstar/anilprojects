<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IFS Bridge</title>
<meta name="theme-color" content="#0E6B87">
<script>try{var t=localStorage.getItem('ifsbridge.theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="./css/app.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark">IFS</span> Bridge</div>
  <nav class="tabs">
    <button data-tab="week">Week</button>
    <button data-tab="expenses">Expenses</button>
    <button data-tab="overview">Overview</button>
    <button data-tab="settings">Settings</button>
  </nav>
</header>

<main>
  <section id="tab-week" class="tab">
    <div class="toolbar">
      <button id="btn-prev" title="Previous week">‹</button>
      <label>Week of Monday <input type="date" id="week-monday"></label>
      <button id="btn-next" title="Next week">›</button>
      <button id="btn-load" class="primary">Load from Clockify</button>
      <button id="btn-bulk" title="Several weeks in one IFS text">Bulk copy…</button>
      <span id="week-status" class="muted"></span>
    </div>
    <div id="week-result"></div>
  </section>

  <section id="tab-expenses" class="tab" hidden></section>

  <section id="tab-overview" class="tab" hidden></section>

  <section id="tab-settings" class="tab" hidden></section>
</main>

<script type="module" src="./js/app.js"></script>
</body>
</html>
